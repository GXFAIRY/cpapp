      const cfg=parseCfg(raw)||JSON.parse(ls.g('ax_fb')||'null')||DEF_FB;
      await loadJs('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadJs('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg),d=app.firestore().collection('spaces').doc(code).collection('items').doc('_test'),to=new Promise((_,rj)=>setTimeout(()=>rj({code:'timeout'}),10000));
      await Promise.race([d.set({t:Date.now()}),to]);const v=await Promise.race([d.get(),to]);setTestMsg(v.exists&&v.data().t?'✓ Connected. Reading and writing both work.':'Connected, but the test entry could not be read back.')}
    catch(e){const c=e&&e.code;setTestMsg(c==='permission-denied'?'✗ The database rules are blocking access. In Firestore Database → Rules, paste the rules from the instructions and tap Publish.':c==='timeout'||c==='unavailable'||c==='failed-precondition'||c==='not-found'?'✗ No answer from the database. Check your internet, and make sure Firestore Database has been created in your Firebase project (Build → Firestore Database → Create database).':c==='network'?'✗ Could not reach the database. Check the address and your internet connection.':'✗ Failed: '+(c||(e&&e.message)))}};
  const openArchive=d=>{setTab('today');setArch(d||true)},importData=f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);let n=0;Object.values(d).forEach(i=>{if(i&&i.id&&i.type&&!IR.current[i.id]){setItem({...i});n++}});toast('Restored '+n+' entries')}catch(e){toast('That is not an AXIS backup file')}};r.readAsText(f)};
  const ctx={arch,setArch,openArchive,me,items,add,upd,del,list,setItem,toast,ai,claudeSample,day,setModal};
  if(!me)return h`<div className="who"><h1>AXIS</h1><p className="mut">Who\u2019s holding this phone? Remembered on this device.</p><button className="btn" onClick=${()=>pick('1')}>♊ ${NAME[1]}</button><button className="btn" onClick=${()=>pick('2')}>♑ ${NAME[2]}</button></div>`;
  const T=TABS.find(t=>t[0]===tab)[3],pend=Object.values(items).filter(i=>i.pending).length;
  const status=!sync?'⌂ device only':syncErr?'⚠ sync problem':online?'☁ synced':'☁ offline';
  const ok=typeof Notification!=='undefined'?Notification.permission:'x';
  return h`<${X.Provider} value=${ctx}>
  <header><h1>AXIS</h1><div className="hr"><button className="pill" onClick=${()=>setModal({k:'who'})}>${SIGN[me]} ${NAME[me]} · ${status}${pend?' · '+pend:''}</button><button className="pill bell" aria-label="Activity" onClick=${()=>setModal({k:'act'})}>🔔${unseen.length>0&&h`<b>${unseen.length}</b>`}</button></div></header>
  ${msg&&h`<div className="toast" role="alert">${msg}</div>`}
  ${tried&&!sync&&!ls.g('ax_space')&&h`<div style=${{padding:'0 16px'}}><button className="banner" onClick=${()=>setModal({k:'sync'})}>⚠ Not syncing yet. Tap here to connect with your partner, so you both see each other\u2019s entries.</button></div>`}
  <main key=${tab}>${ready&&h`<${T}/>`}</main>
  <nav role="tablist">${TABS.map(t=>h`<button key=${t[0]} role="tab" aria-selected=${tab===t[0]} className=${tab===t[0]?'on':''} onClick=${()=>{setTab(t[0]);setArch(null)}}><span>${t[1]}</span>${t[2]}</button>`)}</nav>
  ${modal&&h`<div className="bg" onClick=${()=>setModal(null)}><div className="sheet" role="dialog" aria-modal="true" onClick=${e=>e.stopPropagation()}><div className="grab"/>
    ${modal.k==='who'&&h`<h2>Settings</h2><p className="small">Who is using this phone?</p><div className="row" style=${{marginTop:12}}><button className="btn" onClick=${()=>{pick('1');setModal(null)}}>♊ ${NAME[1]}</button><button className="btn" onClick=${()=>{pick('2');setModal(null)}}>♑ ${NAME[2]}</button></div><p className="small" style=${{marginTop:16}}>Sync status: ${status}${syncErr?' ('+syncErr+')':''}</p><button className="btn ghost" onClick=${()=>setModal({k:'sync'})}>Sync setup</button><button className="btn ghost" onClick=${exportData}>Download backup of all entries</button><label className="btn ghost" style=${{display:'flex',alignItems:'center',justifyContent:'center'}}>Restore from a backup file<input type="file" accept="application/json" hidden onChange=${e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''}}/></label>`}
    ${modal.k==='photo'&&h`<${PhotoView} id=${modal.id}/>`}
    ${modal.k==='sync'&&h`<h2>Sync setup</h2><p className="small" style=${{textAlign:'left'}}>Choose a shared code (6+ characters) and use the exact same code on both phones. The built-in AXIS database is used automatically, so you can leave the box below empty.</p><textarea id="fbc" rows=${3} defaultValue=${ls.g('ax_fbraw')||''} placeholder="Optional: your own database address or Firebase config"/><input type="text" id="fbs" defaultValue=${ls.g('ax_space')||''} placeholder="Shared code, 6+ characters"/><button className="btn ghost" onClick=${testSync}>Test connection</button>${testMsg&&h`<p className="small" style=${{textAlign:'left',color:'var(--ink)'}} role="status">${testMsg}</p>`}<button className="btn" onClick=${saveSync}>Save and reload</button>${(ls.g('ax_fb')||ls.g('ax_rtdb'))&&h`<button className="btn ghost" onClick=${clearSync}>Turn sync off</button>`}<button className="btn ghost" onClick=${()=>setModal(null)}>Cancel</button>`}
    ${modal.k==='act'&&h`<h2>Activity</h2><div style=${{textAlign:'left'}}>${unseen.length?unseen.map((d,i)=>h`<div key=${i} className="it"><div className="t">${LB[d.type]||d.type}: ${d.text||d.title||''}</div><span className=${'tag t'+d.by}>${NAME[d.by]}</span></div>`):h`<p className="small">All caught up.</p>`}</div>
      ${ok==='default'&&h`<button className="btn ghost" onClick=${()=>{try{Notification.requestPermission().then(seen)}catch(e){seen()}}}>Enable device alerts</button>`}<button className="btn" onClick=${seen}>Close</button><p className="small">Alerts arrive while AXIS is open in a tab or installed to your Home Screen.</p>`}
    ${modal.k==='lore'&&h`<h2>${modal.i.title}</h2><p>${modal.i.text}</p><p className="small">${fmt(modal.i.ts)}</p><button className="btn ghost" onClick=${()=>{const a=list('lore');setModal({k:'lore',i:a[Math.floor(Math.random()*a.length)]})}}>Another</button><button className="btn" onClick=${()=>setModal(null)}>Close</button>`}
    ${modal.k==='cool'&&h`<div className="ring"/><h2 style=${{lineHeight:1.4}}>${DE[modal.i]}</h2><button className="btn" onClick=${()=>modal.i<DE.length-1?setModal({k:'cool',i:modal.i+1}):setModal(null)}>${modal.i<DE.length-1?'Next':'Ready'}</button><button className="btn ghost" onClick=${()=>setModal(null)}>Close</button>`}
  </div></div>`}</${X.Provider}>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
